# VAR: font_name
# VAR: text_font_size
font = {font_name}:pixelsize={text_font_size}
prompt = ""
icons-enabled = no
lines = 10
width = 50
# SCALE: 16
horizontal-pad = {16}
# SCALE: 16
vertical-pad = {16}
anchor = top
# SCALE: 100
y-margin = {100}
# SCALE: 8
inner-pad = {8}
# SCALE: 16.5
line-height = {16.5}

[colors]
  # VAR: bg_dim_more
  background = {bg_dim_more}ff
  # VAR: fg_half_dim
  text = {fg_half_dim}ff
  prompt = ff0000ff
  placeholder = ff0000ff
  # VAR: blue
  input = {blue}ff
  # VAR: purple
  match = {purple}ff
  # VAR: bg_dim_more
  selection = {bg_dim_more}ff
  # VAR: blue
  selection-text = {blue}ff
  # VAR: purple
  selection-match = {purple}ff
  # VAR: bg_dim_more
  border = {bg_dim_more}ff

[border]
  width = 0
  # SCALE: 12
  radius = {12}
