# === Interface ===
window-dragging=no

osd-font=Noto Sans
# VAR: osd_font_size
osd-font-size={osd_font_size}
osd-duration=2500
osd-bar-align-y=0.50
osd-bar-w=51
osd-bar-h=2

force-window=immediate

# === Video ===
profile=high-quality
hwdec=auto

panscan=1.0

# === Audio ===
ad-lavc-downmix=no
audio-normalize-downmix=yes
audio-channels=stereo
volume-max=300
alang=jp,fr,fre,en,eng,enm,ru,rus
audio-file-auto=fuzzy

# Normalize volume with dynamic compression
af=lavfi=[dynaudnorm=f=150:g=15:p=0.95:m=8,acompressor=threshold=0.15:ratio=1.8:attack=20:release=250:makeup=1.2:knee=3:detection=rms]

# === Subs ===
secondary-sid=auto
sid=auto
slang=fr,fre,en,eng,enm,jp,ru,rus
sub-ass=no
sub-auto=fuzzy
sub-pos=95
subs-with-matching-audio=no

# === Network ===
ytdl-format=bestvideo+bestaudio/best
ytdl-raw-options=sub-lang="en,ru,th",write-sub=,write-auto-sub=

cache=yes

demuxer-max-bytes=104857600 # 100 MiB
demuxer-max-back-bytes=10485760 # 10 MiB

demuxer-cache-wait=no
demuxer-seekable-cache=yes

# === Misc ===
input-default-bindings=no
save-position-on-quit=yes
reset-on-next-file=pause
load-unsafe-playlists=yes

# === Profiles ===
[battery]
profile-desc=Battery saving
profile=fast

# Disable audio filtering
af=
