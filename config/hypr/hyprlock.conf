general {
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  immediate_render = true
  fractional_scaling = 0
  fail_timeout = 1000
}

background {
  # VAR: bg_dim_more
  color = rgb({bg_dim_more})
}

input-field {
  size = 500, 75
  position = 0, 0

  fade_on_empty = true
  dots_size = 0.2
  dots_spacing = 0.5
  outline_thickness = 3
  placeholder_text =
  fail_text =

  # VAR: bg
  outer_color = rgb({bg})
  # VAR: bg
  inner_color = rgb({bg})
  # VAR: fg
  font_color = rgb({fg})
  # VAR: blue
  check_color = rgb({blue})
  # VAR: red
  fail_color = rgb({red})
  # VAR: orange
  capslock_color = rgb({orange})

  shadow_passes = 1
  shadow_size = 8
  shadow_boost = 0.6
}

label {
  text = cmd[update:10000] TZ=Asia/Bangkok date "+%H:%M"
  # SCALE: 150
  position = 0, {150}

  # VAR: blue
  color = rgba({blue}80)

  # SCALE: 75
  font_size = {75}
  font_family = Noto Sans Mono Thin
}

label {
  text = cmd[update:10000] TZ=Asia/Bangkok date "+%e %B, %A"
  # SCALE: 75
  position = 0, {75}

  # VAR: blue
  color = rgba({blue}80)

  # SCALE: 25
  font_size = {25}
  font_family = Noto Sans Mono Light
}
